# Opt in with: docker compose -f compose.yaml -f compose.dev.yaml up -d --build
# Reuses the default stack's database, storage and TLS volumes. Never use on production.
services:
  caddy:
    ports: !override
      - "127.0.0.1:${RUSH_HTTP_PORT:-80}:80"
      - "127.0.0.1:${RUSH_HTTPS_PORT:-443}:443"
    build:
      dockerfile: docker/caddy/Dockerfile.dev
    depends_on:
      client:
        condition: service_healthy
    volumes:
      - ./docker/caddy/Caddyfile.dev:/etc/caddy/Caddyfile:ro
      - ./docker/client/dev-sw.js:/srv/dev/sw.js:ro
      - ./server/public:/var/www/html/public:ro

  server:
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      SESSION_SECURE_COOKIE: ${SESSION_SECURE_COOKIE:-true}
    command:
      - sh
      - -c
      - php artisan config:clear && php artisan route:clear && php artisan view:clear && exec php-fpm -F
    volumes:
      - ./docker/server/php.dev.ini:/usr/local/etc/php/conf.d/zz-development.ini:ro
      - ./server/app:/var/www/html/app:ro
      - ./server/bootstrap/app.php:/var/www/html/bootstrap/app.php:ro
      - ./server/bootstrap/providers.php:/var/www/html/bootstrap/providers.php:ro
      - ./server/config:/var/www/html/config:ro
      - ./server/database:/var/www/html/database:ro
      - ./server/public:/var/www/html/public:ro
      - ./server/resources:/var/www/html/resources:ro
      - ./server/routes:/var/www/html/routes:ro

  client:
    image: node:24.16.0-alpine3.22
    restart: unless-stopped
    working_dir: /workspace/client
    environment:
      RUSH_DOCKER_DEV: "1"
      RUSH_DEV_ORIGIN: ${APP_URL:-https://localhost}
    command:
      - sh
      - -c
      - npm ci --ignore-scripts && npm run postinstall && npm run dev
    volumes:
      - ./client:/workspace/client
      - ./docs/contracts:/workspace/docs/contracts:ro
      - client_dev_modules:/workspace/client/node_modules
      - client_dev_quasar:/workspace/client/.quasar
    expose:
      - "9000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:9000').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      start_period: 60s
      interval: 2s
      timeout: 5s
      retries: 30
    networks: [public, internal]

volumes:
  client_dev_modules:
  client_dev_quasar:
