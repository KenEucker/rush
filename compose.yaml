name: rush

services:
  caddy:
    build:
      context: .
      dockerfile: docker/caddy/Dockerfile
    depends_on:
      server:
        condition: service_started
    environment:
      RUSH_SITE_ADDRESS: ${RUSH_SITE_ADDRESS:-https://localhost}
    ports:
      - "${RUSH_HTTP_PORT:-80}:80"
      - "${RUSH_HTTPS_PORT:-443}:443"
    restart: unless-stopped
    volumes:
      - caddy_config:/config
      - caddy_data:/data
    networks:
      - public
      - internal

  server:
    build:
      context: .
      dockerfile: docker/server/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_NAME: ${APP_NAME:-RUSH}
      APP_ENV: ${APP_ENV:-production}
      APP_KEY: ${APP_KEY:-}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_URL: ${APP_URL:-https://localhost}
      CACHE_STORE: database
      DB_CONNECTION: pgsql
      DB_DATABASE: ${POSTGRES_DB:-rush}
      DB_HOST: postgres
      DB_PASSWORD: ${POSTGRES_PASSWORD:-change-me-before-deploying}
      DB_PORT: 5432
      DB_USERNAME: ${POSTGRES_USER:-rush}
      LOG_CHANNEL: stderr
      QUEUE_CONNECTION: database
      SESSION_DRIVER: database
      SESSION_SECURE_COOKIE: "true"
      VITE_APP_NAME: ${APP_NAME:-RUSH}
    expose:
      - "9000"
    healthcheck:
      test: ["CMD-SHELL", "php -r \"require 'vendor/autoload.php'; exit(extension_loaded('pdo_pgsql') ? 0 : 1);\""]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    volumes:
      - server_storage:/var/www/html/storage
    networks:
      - internal

  postgres:
    image: postgres:17.2-alpine3.21
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rush}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-before-deploying}
      POSTGRES_USER: ${POSTGRES_USER:-rush}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal

networks:
  public:
  internal:
    internal: true

volumes:
  caddy_config:
  caddy_data:
  postgres_data:
  server_storage:
